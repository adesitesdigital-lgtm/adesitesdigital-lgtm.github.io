<script>
// Instagram stores "#services" as "%23services", which GitHub Pages treats as a missing page: send it (and any dead link) to the home page, keeping tracking parameters.
var p = decodeURIComponent(location.pathname).replace(/^\//, '');
location.replace('/' + location.search + (p.charAt(0) === '#' ? p : location.hash));
</script>
